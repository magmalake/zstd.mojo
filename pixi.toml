[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "zstd.mojo"
version = "0.1.1"
description = "A Mojo binding to libzstd (one-shot and streaming compress/decompress) via FFI."
preview = ["pixi-build"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
zstd = ">=1.5,<2"
# The FFI shim is a pixi package (shim/); pixi builds it and installs
# lib/libzstdmojo.so into the env — no manual build step.
zstd-shim = { path = "shim" }

[tasks]
# Round-trip gate: compress -> decompress -> original, at several sizes and
# levels, plus streaming == one-shot and a known-frame cross-check against
# Python `zstandard`. The shim is dlopened at runtime from $CONDA_PREFIX/lib,
# installed by the zstd-shim package.
test = { cmd = "mkdir -p build && mojo build test/zstd_test.mojo -I src -o build/zstd-test && ./build/zstd-test" }

# Throughput on 64 MiB compressible + random buffers (see README "Perf").
bench = { cmd = "mkdir -p build && mojo build bench/bench_zstd.mojo -I src -o build/zstd-bench && ./build/zstd-bench" }

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is zstd-mojo (conda-forge owns "zstd"); the Mojo import
# stays `from zstd import …`.
[package]
name = "zstd-mojo"
version = "0.1.1"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/zstd"
name = "zstd"

[package.host-dependencies]
mojo-compiler = "==1.0.0"

[package.build-dependencies]
mojo-compiler = "==1.0.0"

[package.run-dependencies]
mojo-compiler = ">=1.0.0,<2"
zstd-shim = { path = "shim" }

# ── stable / nightly toolchain matrix (see CI) ──────────────────────────────
[feature.nightly.dependencies]
modular = ">=26.6.0.dev2026082605,<27"

[feature.stable.dependencies]
mojo-compiler = "==1.0.0"

[environments]
default = ["nightly"]
stable = ["stable"]
